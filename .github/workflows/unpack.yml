name: Unpack data pack

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ipl-deliveries-pack.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip data pack
        run: |
          set -e
          if [ ! -f ipl-deliveries-pack.zip ]; then echo "No ipl-deliveries-pack.zip found"; ls -la; exit 1; fi
          unzip -o ipl-deliveries-pack.zip -d _unpacked
          if [ -f _unpacked/deliveries.csv ]; then mv _unpacked/deliveries.csv ./deliveries.csv; else CSV=$(find _unpacked -type f -name deliveries.csv -print -quit); if [ -n "$CSV" ]; then mv "$CSV" ./deliveries.csv; fi; fi
          rm -rf _unpacked ipl-deliveries-pack.zip
          ls -lh deliveries.csv
          git status --short
      - name: Commit unpacked data
        run: |
          git config user.name "Suraj881711"
          git config user.email "Suraj881711@users.noreply.github.com"
          git add -A
          git commit -m "Unpack deliveries data pack" || echo "Nothing to commit"
          git push
